name: Gibwork Bounty CI/CD Engine

on:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  # 1. Automated Verification on PR
  verify-bounty:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Bounty Tests
        run: |
          npx git-bounty test --cmd "npm test"

  # 2. Automated Merge-to-Payout Escrow Release
  settle-bounty:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Settle On-Chain Gibwork Escrow
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.GIBWORK_SPONSOR_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIBWORK_NETWORK: production
        run: |
          npx git-bounty settle ${{ github.event.pull_request.number }} --yes
